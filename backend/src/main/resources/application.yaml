spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET}
    access-token-expiration-minutes: ${APP_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
    registration-token-expiration-minutes: ${APP_REGISTRATION_TOKEN_EXPIRATION_MINUTES:10}
    refresh-token-expiration-days: ${APP_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    kakao:
      native-app-key: ${KAKAO_NATIVE_APP_KEY:}
      admin-key: ${KAKAO_ADMIN_KEY:}
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
  storage:
    type: ${STORAGE_TYPE:local}
    local-directory: ${LOCAL_STORAGE_DIRECTORY:${java.io.tmpdir}/4team-recordings}
  audio-processing:
    mode: ${AUDIO_PROCESSING_MODE:mock}
  processing-recovery:
    enabled: ${PROCESSING_RECOVERY_ENABLED:true}
    stale-after: ${PROCESSING_RECOVERY_STALE_AFTER:5m}
    initial-delay: ${PROCESSING_RECOVERY_INITIAL_DELAY:10s}
    fixed-delay: ${PROCESSING_RECOVERY_FIXED_DELAY:1m}
    batch-size: ${PROCESSING_RECOVERY_BATCH_SIZE:50}
  account-deletion:
    initial-delay: ${ACCOUNT_DELETION_INITIAL_DELAY:10s}
    fixed-delay: ${ACCOUNT_DELETION_FIXED_DELAY:1m}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
    summary-model: ${OPENAI_SUMMARY_MODEL:gpt-4o-mini}
    tts-model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
    tts-voice: ${OPENAI_TTS_VOICE:alloy}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:10s}
    read-timeout: ${OPENAI_READ_TIMEOUT:90s}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}
    signed-url-duration: ${R2_SIGNED_URL_DURATION:15m}
