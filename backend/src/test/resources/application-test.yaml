spring:
  datasource:
    url: jdbc:h2:mem:apptive;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  auth:
    jwt-secret: test-only-jwt-secret-at-least-32-bytes
    access-token-expiration-minutes: 30
    registration-token-expiration-minutes: 10
    refresh-token-expiration-days: 30
    kakao:
      native-app-key: test-kakao-native-app-key
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
  recording:
    mock-processing-delay-ms: 5
  processing-recovery:
    enabled: false
    stale-after: 1m
    batch-size: 50
