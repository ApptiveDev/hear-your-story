spring:
  datasource:
    url: jdbc:h2:mem:apptive;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  auth:
    jwt-secret: test-only-jwt-secret-at-least-32-bytes
    access-token-expiration-days: 30
  recording:
    mock-processing-delay-ms: 5
